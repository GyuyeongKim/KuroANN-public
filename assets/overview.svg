<svg xmlns="http://www.w3.org/2000/svg" width="940" height="334" viewBox="0 0 940 334" role="img" aria-labelledby="t">
  <title id="t">A query and its filter go to the postings, which give the match count before any read. The count picks a row of the plan. The row sets the route and the pool of PQ codes to rank in memory. Reads go from the best estimate down and stop once no unread candidate is likely to beat the k-th best.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #17151C; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .band { font-size: 12px; font-weight: 600; fill: #7A45B5; letter-spacing: 0.04em; }
    .box { fill: #FFFFFF; stroke: #B8B4C0; stroke-width: 1.2; }
    .row { fill: #F2EBFB; }
    .arrow { stroke: #7A45B5; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      text { fill: #EEEDF1; }
      .band { fill: #F7A1C9; }
      .box { fill: #1D1A22; stroke: #4D4756; }
      .row { fill: #2E2232; }
      .bg { fill: #131117; stroke: #2D2934; }
      .bg2 { fill: #1E1B24; stroke: #2D2934; }
      .arrow { stroke: #F7A1C9; }
      #a path { fill: #F7A1C9; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7A45B5"/></marker></defs>

  <rect class="bg" x="8" y="8" width="924" height="216" rx="10" fill="#F6F5F8" stroke="#E5E3E9"/>
  <text class="band" x="24" y="30">IN MEMORY</text>
  <rect class="bg2" x="408" y="236" width="524" height="90" rx="10" fill="#F4F3F6" stroke="#E5E3E9"/>
  <text class="band" x="424" y="254">ON THE SSD</text>

  <rect class="box" x="24" y="44" width="172" height="164" rx="8"/>
  <text class="h" x="38" y="68">Query and filter</text>
  <text class="s" x="38" y="92">"kitchen items &lt; $50"</text>
  <text class="m" x="38" y="122">AND 2</text>
  <text class="m" x="50" y="140">L 7</text>
  <text class="m" x="50" y="158">R price 0 5000</text>

  <rect class="box" x="226" y="44" width="162" height="164" rx="8"/>
  <text class="h" x="240" y="68">1. Count</text>
  <text class="s" x="240" y="92">Postings sorted by</text>
  <text class="s" x="240" y="109">position give the</text>
  <text class="s" x="240" y="126">match count before</text>
  <text class="s" x="240" y="143">the first read.</text>
  <text class="m" x="240" y="180">31,204 matches</text>

  <rect class="box" x="418" y="44" width="240" height="164" rx="8"/>
  <text class="h" x="432" y="68">2. Plan</text>
  <text class="s" x="432" y="92">Calibrated per recall target.</text>
  <text class="s" x="432" y="116">count</text><text class="s" x="492" y="116">route</text><text class="s" x="586" y="116">pool</text>
  <text class="m" x="432" y="136">&lt; 3K</text><text class="m" x="492" y="136">all matches</text><text class="m" x="586" y="136">64</text>
  <rect class="row" x="426" y="143" width="226" height="21" rx="4"/>
  <text class="m" x="432" y="158">&lt; 100K</text><text class="m" x="492" y="158">all matches</text><text class="m" x="586" y="158">192</text>
  <text class="m" x="432" y="182">more</text><text class="m" x="492" y="182">2,048 parts</text><text class="m" x="586" y="182">256</text>

  <rect class="box" x="688" y="44" width="228" height="164" rx="8"/>
  <text class="h" x="702" y="68">3. Rank</text>
  <text class="s" x="702" y="92">PQ codes estimate each</text>
  <text class="s" x="702" y="109">distance on the chosen route.</text>
  <text class="s" x="702" y="126">The best estimates form</text>
  <text class="s" x="702" y="143">the pool.</text>
  <text class="m" x="702" y="180">192 candidates</text>

  <rect class="box" x="424" y="262" width="492" height="54" rx="8"/>
  <text class="h" x="438" y="294">4. Read and stop</text>
  <text class="s" x="570" y="284">One 4 KiB read per candidate, best estimate first.</text>
  <text class="s" x="570" y="303">Stop once the rest is unlikely to beat the k-th best.</text>
  <text class="h" x="212" y="294">Top k answers</text>

  <path class="arrow" d="M196 126 H224"/>
  <path class="arrow" d="M388 126 H416"/>
  <path class="arrow" d="M658 126 H686"/>
  <path class="arrow" d="M802 208 V260"/>
  <path class="arrow" d="M424 289 H316"/>
</svg>
