[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "kuroann"
version = "1.0.0"
description = "Filtered vector search on SSDs that sets how much each query reads from its match count"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
build.targets = ["kuroann_py"]
install.components = []
wheel.packages = []
